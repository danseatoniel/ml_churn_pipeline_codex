[project]
name = "ml-churn-feature-pipeline"
version = "0.1.0"
description = "Local-first tabular customer churn feature pipeline for repo triage exercises."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
]

[project.scripts]
churn-pipeline = "churn_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
